<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 224" role="img" aria-label="UCalgary Gaming Club mascot: a red T-rex playing an arcade machine">
  <style>
    .lg-ink{fill:#0D0D10}
    .lg-red{fill:#E8192C}
    .lg-red-d{fill:#B00F1F}
    .lg-white{fill:#FFFFFF}
    .lg-screen{fill:#08080C}
  </style>

  <!-- ground shadow -->
  <ellipse cx="118" cy="206" rx="104" ry="10" class="lg-ink" opacity=".18"/>

  <!-- ===== ARCADE CABINET ===== -->
  <path class="lg-ink" d="M156 204V98c0-9 7-16 16-16h52c9 0 16 7 16 16v106z"/>
  <!-- marquee -->
  <rect class="lg-red" x="163" y="88" width="70" height="20" rx="5"/>
  <rect class="lg-white" x="171" y="95" width="54" height="6" rx="3" opacity=".85"/>
  <!-- screen -->
  <rect class="lg-screen" x="164" y="116" width="68" height="44" rx="5"/>
  <rect class="lg-red" x="171" y="124" width="10" height="10" rx="2"/>
  <rect class="lg-red" x="187" y="124" width="10" height="10" rx="2" opacity=".65"/>
  <rect class="lg-red" x="203" y="124" width="10" height="10" rx="2" opacity=".4"/>
  <rect class="lg-white" x="171" y="146" width="26" height="5" rx="2.5" opacity=".9"/>
  <rect class="lg-white" x="203" y="144" width="20" height="9" rx="3" opacity=".55"/>
  <!-- control deck -->
  <path class="lg-red-d" d="M150 190l6-20h84l6 20z"/>
  <!-- joystick -->
  <rect class="lg-ink" x="176" y="166" width="5" height="12" rx="2.5"/>
  <circle class="lg-red" cx="178.5" cy="164" r="6.5"/>
  <!-- buttons -->
  <circle class="lg-white" cx="205" cy="178" r="5"/>
  <circle class="lg-white" cx="220" cy="174" r="5" opacity=".75"/>

  <!-- ===== T-REX ===== -->
  <!-- tail -->
  <path class="lg-red" d="M64 142c-16 4-30 0-44-12 16 2 26 0 34-8z"/>
  <!-- legs -->
  <path class="lg-red-d" d="M66 160h20v34a6 6 0 0 1-6 6H66a6 6 0 0 1-6-6v-28a6 6 0 0 1 6-6z"/>
  <path class="lg-red" d="M96 160h22v34a6 6 0 0 1-6 6H96a6 6 0 0 1-6-6v-28a6 6 0 0 1 6-6z"/>
  <path class="lg-ink" d="M56 194h32v6a4 4 0 0 1-4 4H60a4 4 0 0 1-4-4z" opacity=".35"/>
  <!-- body -->
  <path class="lg-red" d="M66 92c26-10 52-4 62 16 8 15 6 36-6 48-12 13-40 16-56 6-15-9-20-30-14-48 3-9 8-17 14-22z"/>
  <!-- belly -->
  <path class="lg-red-d" d="M78 150c14 8 34 7 44-2-2 10-12 18-26 18-9 0-15-6-18-16z" opacity=".55"/>
  <!-- arm reaching to joystick -->
  <path class="lg-red-d" d="M120 126c14-2 30 8 42 22l-9 7c-10-11-22-18-33-17z"/>
  <path class="lg-white" d="M150 152l10 8-6 4-8-7z" opacity=".9"/>
  <!-- head -->
  <path class="lg-red" d="M74 62c0-13 12-23 28-23h36c12 0 20 7 20 16v12c0 7-5 12-13 12h-8l-6 10H92c-11 0-18-7-18-17z"/>
  <!-- jaw + teeth -->
  <path class="lg-white" d="M100 79h58l-6 8h-46z" opacity=".95"/>
  <path class="lg-red-d" d="M104 79l5 8h-9zm14 0l5 8h-9zm14 0l5 8h-9zm14 0l5 8h-9z"/>
  <!-- eye -->
  <circle class="lg-white" cx="130" cy="58" r="9"/>
  <circle class="lg-ink" cx="133" cy="58" r="4.5"/>
  <!-- brow / spikes -->
  <path class="lg-red-d" d="M116 44h30v7h-30zM74 74l-10-6 12-5zM80 96l-14-4 12-8z" opacity=".7"/>
  <!-- nostril -->
  <circle class="lg-red-d" cx="152" cy="62" r="3"/>
</svg>
